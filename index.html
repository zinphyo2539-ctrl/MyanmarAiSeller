    <meta name="description" content="Myanmar AI Seller Merchant Platform and ShopSone (ဆိုင်စုံ) multi-store shopping destination - ဆိုင်စုံ၊ ပစ္စည်းစုံ၊ တစ်နေရာတည်း." />
    <meta property="og:title" content="Myanmar AI Seller & ShopSone (ဆိုင်စုံ)" />
    <meta property="og:description" content="ShopSone (ဆိုင်စုံ) - ဆိုင်စုံ၊ ပစ္စည်းစုံ၊ တစ်နေရာတည်း. Powered by Myanmar AI Seller." />

    <link rel="icon" type="image/jpeg" href="/assets/aistudio/1792178753519_42de44bf.jpg" />
    <script>
      // Ignore Vite HMR / WebSocket client connection notices in iframe preview
      window.addEventListener('error', function(event) {
        if (
          (event.message && (
            event.message.includes('WebSocket') ||
            event.message.includes('createWebSocketModuleRunnerTransport') ||
            event.message.includes('@vite/client')
          )) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = String(event.reason || '');
        var stackStr = String(event.reason && event.reason.stack || '');
        if (
          reasonStr.includes('WebSocket') ||
          reasonStr.includes('createWebSocketModuleRunnerTransport') ||
          stackStr.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
