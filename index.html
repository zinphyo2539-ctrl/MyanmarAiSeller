<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myanmar AI Seller - Custom AI Sales Personality</title>
    <meta name="description" content="Custom AI Sales Personality, Instructions & Sample Replies for Myanmar Merchants with Premium Orange Design." />
    <meta property="og:title" content="Myanmar AI Seller - Custom AI Sales Personality" />
    <meta property="og:description" content="Custom AI Sales Personality, Instructions & Sample Replies for Myanmar Merchants." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Ignore Vite HMR / WebSocket client connection notices in iframe preview
      window.addEventListener('error', function(event) {
        if (
          (event.message && (
            event.message.includes('WebSocket') ||
            event.message.includes('createWebSocketModuleRunnerTransport') ||
            event.message.includes('@vite/client')
          )) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = String(event.reason || '');
        var stackStr = String(event.reason && event.reason.stack || '');
        if (
          reasonStr.includes('WebSocket') ||
          reasonStr.includes('createWebSocketModuleRunnerTransport') ||
          stackStr.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
